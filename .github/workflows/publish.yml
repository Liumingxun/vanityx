name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The wasm module is compiled from the Go sources during the build, so
      # the publishing runner needs the same toolchain the library was
      # developed against.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.43.0"
          install-binaryen: "false"

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Build wasm module and bundle the package
        run: vpr build --no-cache

      - name: Publish to npm
        run: vp pm publish --access public --provenance
